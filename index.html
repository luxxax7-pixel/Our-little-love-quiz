<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fff0f7">
<title>Our Little Love Quiz ♡</title>
<style>
:root{--pink:#ff6fae;--rose:#ff9bc8;--ink:#61364f;--muted:#9d7188;--paper:#fffafd;--line:#f6d8e7;--lilac:#f1e9ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 5%,#ffe2f0 0,transparent 28%),radial-gradient(circle at 90% 20%,#eee4ff 0,transparent 25%),#fff8fc;color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
button,input,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:16px;padding:13px 17px;font-weight:750;color:white;background:linear-gradient(135deg,#ff75b4,#f58cce);box-shadow:0 7px 18px #f6a6cc55}button.secondary{background:#fff;color:#a34f7b;border:1px solid var(--line);box-shadow:none}button:disabled{opacity:.45;cursor:not-allowed}
.wrap{max-width:720px;margin:auto;padding:22px 16px 44px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}.brand{font-weight:900;letter-spacing:.2px}.pill{background:#fff;border:1px solid var(--line);border-radius:99px;padding:6px 11px;color:#b65e8b;font-size:12px;font-weight:800}
.card{background:#ffffffdf;border:1px solid #f5d5e5;border-radius:28px;padding:clamp(20px,5vw,36px);box-shadow:0 18px 55px #d989b51b;backdrop-filter:blur(8px)}
.cat{font-size:48px;line-height:1.2;text-align:center;margin:2px 0 10px}.eyebrow{text-align:center;color:#d35f98;font-weight:850;text-transform:uppercase;font-size:11px;letter-spacing:2px}
h1{font-size:clamp(28px,7vw,42px);line-height:1.12;text-align:center;margin:8px 0 12px;letter-spacing:-1px}h2{font-size:23px;line-height:1.25;margin:8px 0 18px}p{color:var(--muted)}.center{text-align:center}.small{font-size:13px}.stack{display:grid;gap:12px}.field{display:grid;gap:6px;font-weight:750;font-size:14px}input,textarea{width:100%;border:1px solid var(--line);border-radius:14px;padding:13px 14px;background:#fff;color:var(--ink);outline:none}input:focus,textarea:focus{border-color:#ed8fbc;box-shadow:0 0 0 3px #ffddec}.options{display:grid;gap:10px}.option{width:100%;text-align:left;background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none;border-radius:16px;display:flex;align-items:center;gap:10px;padding:14px}.option .letter{width:30px;height:30px;border-radius:10px;background:#fff0f7;color:#c55d91;display:grid;place-items:center;flex-shrink:0}.option.selected{border:2px solid #f27db4;background:#fff0f7}.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.progress{height:7px;border-radius:20px;background:#f7e4ee;overflow:hidden;margin:18px 0}.progress span{display:block;height:100%;background:linear-gradient(90deg,#ff83b8,#c4a1ff);border-radius:20px}.footer{display:flex;justify-content:space-between;gap:10px;margin-top:20px}.footer button{flex:1}.note{margin-top:14px}.note label{font-size:13px;color:var(--muted);font-weight:750}.linkbox{overflow-wrap:anywhere;background:#fff2f8;border:1px dashed #ed9bc2;border-radius:14px;padding:12px;font-size:13px}.toast{color:#b04f82;font-size:13px;min-height:18px}.hidden{display:none!important}.result{border:1px solid var(--line);background:white;border-radius:18px;padding:15px;margin:12px 0}.result .q{font-weight:850}.answer{color:#bc5388;font-weight:750}.tag{display:inline-block;background:#f5ecff;border-radius:99px;padding:4px 9px;font-size:12px;font-weight:800;color:#8662b4}
@media(max-width:420px){.top{align-items:flex-start}.card{border-radius:23px}.footer button{padding:12px 8px}.brand{font-size:14px}}
</style>
</head>
<body><main class="wrap">
<div class="top"><div class="brand">🐱 Our Little Love Quiz</div><span class="pill">MADE WITH ♡</span></div>
<section id="app" class="card"></section>
<p class="center small">A tiny love project for two people 💗</p>
</main>
<script>
const QUESTIONS=[
{q:"What's your favourite dessert?",o:["Rasmalai","Gulab jamun","Strawberry cheesecake","Ice cream"]},
{q:"What's your favourite animal?",o:["Cat","Rabbit","Dog","Panda"]},
{q:"What's your favourite street food?",o:["Momos","Bhel Puri","Noodles","Dosa"]},
{q:"What's your favourite drink?",o:["Tea","Mango shake","Oreo shake","Cold coffee"]},
{q:"What's your favourite fruit?",o:["Strawberry","Watermelon","Mango","Grapes"]},
{q:"What's your favourite cartoon?",o:["Shinchan","Doraemon","Tom and Jerry","Oggy and the Cockroaches"]},
{q:"What little thing can instantly make your day better?",o:["A sweet message from your person","An unexpected call from family","A cute little gift","Your favourite snack or drink"]},
{q:"What's your favourite kind of gift to receive?",o:["A handmade gift or heartfelt letter","A cute plushie or cuddly toy","A useful gadget you'd enjoy using","A mystery gift with a surprise inside"]},
{q:"What do you love receiving from your person the most?",o:["Voice notes 🎙️","Cute photos 📸","Long, heartfelt paragraphs 💌","Something else 💝"]},
{q:"Which nickname from your person makes you blush the most?",o:["Hubby / Wifey 💍","Baby / Babe 🧸","Mela Baccha 🎀","Meri Jaan ❤️"]}
];
const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(action,data={},method="POST"){const url=method==="GET"?`/api/quiz?code=${encodeURIComponent(data.code||"")}`:"/api/quiz";let r=await fetch(url,{method,headers:method==="GET"?{}:{"Content-Type":"application/json"},...(method==="GET"?{}:{body:JSON.stringify({action,...data})})});let j=await r.json().catch(()=>({error:"Unexpected server response."}));if(!r.ok)throw new Error(j.error||"Something went wrong.");return j}
let mode="home",creator="",quizCode="",quiz=null,respondent="",idx=0,answers=Array(10).fill(null),notes=Array(10).fill(""),draftKey=Array(10).fill(null),customAnswer="",reveal=0,result=null;
function set(h){app.innerHTML=h}function fail(e){const m=$("#msg");if(m)m.textContent=e.message||"Please try again.";else set(`<div class="cat">🥺</div><h1>Something went wrong</h1><p class="center">${esc(e.message||"Please try again.")}</p><button id="back">Back home</button>`),$("#back").onclick=home}
function home(){mode="home";let code=new URLSearchParams(location.search).get("q");if(code){openQuiz(code);return}set(`<div class="cat">🐱💗🐱</div><div class="eyebrow">a little quiz for your favourite person</div><h1>How well do you know me?</h1><p class="center">Ten tiny questions, a few cute notes, and one very sweet reveal. 🌷</p><div class="stack"><button id="create">💌 Create my quiz</button><button class="secondary" id="join">♡ Open a quiz link</button></div><p class="small center">Made for two people, with love. 💗</p>`);$("#create").onclick=creatorScreen;$("#join").onclick=()=>set(`<div class="cat">💌</div><h1>Open a quiz</h1><p>Paste the quiz link or enter its share code.</p><form id="joinForm" class="stack"><label class="field">Quiz link or code<input id="joinCode" required placeholder="Paste link or code"></label><button>Open quiz →</button></form><button class="secondary" id="back">← Back</button>`),$("#joinForm").onsubmit=e=>{e.preventDefault();let v=$("#joinCode").value.trim();let c=v.includes("q=")?new URL(v,location.href).searchParams.get("q"):v;openQuiz(c)},$("#back").onclick=home}
function creatorScreen(){mode="creator";set(`<div class="cat">🎀🐱</div><div class="eyebrow">make your own quiz</div><h1>Who's making the quiz?</h1><form id="creatorForm" class="stack"><label class="field">Your display name<input id="creatorName" maxlength="40" required placeholder="e.g. Luxx / Anyu"></label><button>Create my quiz →</button></form><p class="toast" id="msg"></p><button class="secondary" id="back">← Back</button>`);$("#creatorForm").onsubmit=e=>{e.preventDefault();creator=$("#creatorName").value.trim();draftKey=Array(10).fill(null);customAnswer="";idx=0;keySetup()};$("#back").onclick=home}
function keySetup(){mode="key";let q=QUESTIONS[idx];set(`<div class="eyebrow">setting your answer key · ${idx+1}/10</div><div class="progress"><span style="width:${(idx+1)*10}%"></span></div><h2>${esc(q.q)}</h2><div class="options">${q.o.map((o,i)=>`<button class="option ${draftKey[idx]===i?"selected":""}" data-i="${i}"><span class="letter">${"ABCD"[i]}</span>${esc(o)}</button>`).join("")}</div>${idx===8?`<div class="note"><label>If you choose D, write your own answer (optional)</label><input id="custom" maxlength="160" value="${esc(customAnswer)}" placeholder="Your own answer"></div>`:""}<div class="footer"><button class="secondary" id="prev" ${idx===0?"disabled":""}>← Back</button><button id="next" ${draftKey[idx]===null?"disabled":""}>${idx===9?"Create my link ♡":"Next →"}</button></div><p class="toast" id="msg"></p>`);app.querySelectorAll(".option").forEach(b=>b.onclick=()=>{draftKey[idx]=+b.dataset.i;keySetup()});if(idx===8)$("#custom").oninput=()=>customAnswer=$("#custom").value;$("#prev").onclick=()=>{if(idx>0){idx--;keySetup()}};$("#next").onclick=async()=>{if(idx<9){idx++;keySetup();return}if(idx===8)customAnswer=$("#custom")?.value.trim()||customAnswer;const b=$("#next");b.disabled=true;b.textContent="Creating…";try{const r=await api("create",{creator_name:creator,questions:QUESTIONS,answer_key:draftKey,custom_answer:customAnswer});quizCode=r.share_code;quiz={creator,questions:QUESTIONS};shareScreen()}catch(e){fail(e)}}}
function shareScreen(){mode="share";const url=new URL(location.href);url.search="?q="+encodeURIComponent(quizCode);set(`<div class="cat">💌🐱💗</div><div class="eyebrow">your quiz is ready</div><h1>Made with love, ${esc(creator)}!</h1><p class="center">Send this link to your person. Their answers stay hidden until the reveal. 🌷</p><div class="linkbox" id="url">${esc(url.href)}</div><div class="stack" style="margin-top:14px"><button id="copy">Copy quiz link ♡</button><button class="secondary" id="preview">Preview quiz</button><button class="secondary" id="home">Back to home</button></div><p class="small center">Your quiz is saved online. 💗</p>`);$("#copy").onclick=async()=>{try{await navigator.clipboard.writeText(url.href);$("#copy").textContent="Copied! 💗"}catch{$("#url").textContent=url.href+" — copy this link manually"}};$("#preview").onclick=()=>openQuiz(quizCode);$("#home").onclick=()=>{history.replaceState({},"",location.pathname);home()}}
async function openQuiz(code){mode="loading";set(`<div class="cat">🌷</div><h1>Opening your quiz…</h1><p class="center">Just a tiny moment 💗</p>`);try{const data=await api("get",{code},"GET");quizCode=data.share_code;quiz={creator:data.creator_name,questions:data.questions};set(`<div class="cat">🌷💗</div><div class="eyebrow">a little quiz from</div><h1>${esc(quiz.creator)}</h1><p class="center">Ready to see how well you know them? No spoilers until the end. 🐱</p><form id="respondForm" class="stack"><label class="field">Your name or nickname<input id="respondName" maxlength="40" required placeholder="What should we call you?"></label><button>Let's play! →</button></form><button class="secondary" id="back" style="margin-top:12px">Back home</button>`);$("#respondForm").onsubmit=e=>{e.preventDefault();respondent=$("#respondName").value.trim();answers=Array(10).fill(null);notes=Array(10).fill("");idx=0;play()};$("#back").onclick=()=>{history.replaceState({},"",location.pathname);home()}}catch(e){set(`<div class="cat">🥺🐱</div><h1>Quiz not found</h1><p class="center">${esc(e.message)} Check the link and try again.</p><button id="back">Back home</button>`);$("#back").onclick=()=>{history.replaceState({},"",location.pathname);home()}}}
function play(){mode="play";let start=Math.floor(idx/2)*2,end=Math.min(start+2,10);set(`<div class="eyebrow">${esc(quiz.creator)}'s quiz · for ${esc(respondent)}</div><div class="progress"><span style="width:${end*10}%"></span></div><div class="pill">Questions ${start+1}–${end} of 10</div>${QUESTIONS.slice(start,end).map((q,j)=>{let n=start+j;return `<section style="margin-top:20px"><h2>${n+1}. ${esc(q.q)}</h2><div class="options">${q.o.map((o,i)=>`<button class="option ${answers[n]===i?"selected":""}" data-q="${n}" data-i="${i}"><span class="letter">${"ABCD"[i]}</span>${esc(o)}</button>`).join("")}</div>${n===8?`<div class="note"><label>If you choose D, tell them your answer</label><input data-custom maxlength="160" value="${esc(notes[n])}" placeholder="Your own answer..."></div>`:""}<div class="note"><label>Optional cute note 💌</label><textarea data-note="${n}" rows="2" maxlength="240" placeholder="A tiny message for them...">${esc(notes[n])}</textarea></div></section>`}).join("")}<div class="footer"><button class="secondary" id="prev" ${start===0?"disabled":""}>← Previous</button><button id="next">${end===10?"Finish quiz ♡":"Next →"}</button></div><p class="toast" id="msg"></p>`);app.querySelectorAll(".option").forEach(b=>b.onclick=()=>{answers[+b.dataset.q]=+b.dataset.i;play()});app.querySelectorAll("[data-note]").forEach(n=>n.oninput=()=>notes[+n.dataset.note]=n.value);$("[data-custom]")?.addEventListener("input",e=>notes[8]=e.target.value);$("#prev").onclick=()=>{idx=Math.max(0,start-2);play()};$("#next").onclick=async()=>{let missing=[];for(let n=start;n<end;n++)if(answers[n]===null)missing.push(n+1);if(missing.length){$("#msg").textContent="Choose an answer for question "+missing.join(", ")+" first 💗";return}if(end<10){idx=end;play();return}const b=$("#next");b.disabled=true;b.textContent="Saving…";try{result=await api("submit",{share_code:quizCode,respondent_name:respondent,answers,notes});reveal=0;revealOne()}catch(e){b.disabled=false;b.textContent="Finish quiz ♡";$("#msg").textContent=e.message}}}
function revealOne(){mode="reveal";if(reveal>=10){set(`<div class="cat">🎉🐱💗</div><div class="eyebrow">the final score</div><h1>${result.score}/10 correct!</h1><p class="center">${result.score===10?"A PERFECT MATCHING MIND! 💞":result.score>=7?"You know them pretty well! 🌷":"More cute little things to learn about each other. 💌"}</p><button id="home" style="width:100%">Home ♡</button><button id="again" class="secondary" style="width:100%;margin-top:10px">View the reveal again</button>`);$("#home").onclick=()=>{history.replaceState({},"",location.pathname);home()};$("#again").onclick=()=>{reveal=0;revealOne()};return}let i=reveal,correct=result.answer_key[i],given=answers[i],q=QUESTIONS[i];set(`<div class="eyebrow">the big reveal · ${i+1}/10</div><div class="progress"><span style="width:${(i+1)*10}%"></span></div><div class="cat">${given===correct?"🥹💗":"🐱🌷"}</div><h2>${i+1}. ${esc(q.q)}</h2><div class="result"><div class="small">THEIR ANSWER</div><div class="answer">${"ABCD"[correct]}) ${esc(q.o[correct])}${i===8&&correct===3&&result.custom_answer?" — "+esc(result.custom_answer):""}</div></div><div class="result"><div class="small">YOUR GUESS</div><div>${"ABCD"[given]}) ${esc(q.o[given])}${i===8&&given===3&&notes[i]?" — "+esc(notes[i]):""}</div><span class="tag">${given===correct?"MATCH! 💗":"NOT QUITE 🌷"}</span></div>${notes[i]?`<div class="result"><div class="small">YOUR NOTE 💌</div>${esc(notes[i])}</div>`:""}<button id="next" style="width:100%;margin-top:10px">${i===9?"See my score ✨":"Next answer →"}</button>`);$("#next").onclick=()=>{reveal++;revealOne()}}
home();

</script></body></html>
